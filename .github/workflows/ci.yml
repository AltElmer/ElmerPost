name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64 (gcc)
            os: ubuntu-24.04
            run-gui: true
            fortran: true
          - name: linux-arm64 (gcc)
            os: ubuntu-24.04-arm
            run-gui: true
            fortran: true
          - name: linux-x86_64 (clang)
            os: ubuntu-24.04
            apt-clang: true
            cmake-extra: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            fortran: true
          - name: linux-x86_64 (intel icx)
            os: ubuntu-24.04
            intel: true
            cmake-extra: -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_Fortran_COMPILER=ifx
            fortran: true
          - name: windows-x86_64 (mingw)
            os: windows-2022
            mingw: true
            msystem: UCRT64
            msys-packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-gcc-fortran
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-tcl
              mingw-w64-ucrt-x86_64-tk
            fortran: true
          # Native arm64 Windows. MSYS2's arm64 environment packages Tcl, Tk,
          # CMake and Ninja but no Fortran compiler at all, which is what made
          # sico2elmer optional: ElmerPost itself is C, and requiring Fortran
          # for it put the whole build out of reach of this architecture.
          - name: windows-arm64 (clang, no fortran)
            os: windows-11-arm
            mingw: true
            msystem: CLANGARM64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-tcl
              mingw-w64-clang-aarch64-tk
            fortran: false
          # macOS, through XQuartz.
          #
          # ElmerPost's non-Windows path is an X11 program: it uses Display,
          # Window and Visual directly to put a GL context inside a Tk window.
          # macOS has no X11 of its own and Homebrew's Tcl/Tk is an Aqua build,
          # so neither the window system nor the toolkit is there by default.
          # Both are obtainable: XQuartz supplies X11 and a GLX capable libGL,
          # and Tk builds against it with --enable-aqua=no. That is a cost in
          # build time rather than a reason the platform cannot work.
          #
          # The OpenGL variables are pointed at XQuartz on purpose. macOS has
          # its own OpenGL framework and CMake's FindOpenGL prefers it, which
          # gives <OpenGL/gl.h> and no <GL/gl.h>; ElmerPost and GLAUX include
          # the latter, and the GLX calls need XQuartz's GL anyway.
          - name: macos-arm64 (clang, xquartz)
            os: macos-14
            macos-x11: true
            fortran: true
            cmake-extra: >-
              -DOPENGL_INCLUDE_DIR=/opt/X11/include
              -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib
              -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib
          - name: macos-x86_64 (clang, xquartz)
            os: macos-15-intel
            macos-x11: true
            fortran: true
            cmake-extra: >-
              -DOPENGL_INCLUDE_DIR=/opt/X11/include
              -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib
              -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libgl1-mesa-dev libglu1-mesa-dev \
            tcl-dev tk-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev \
            xvfb mesa-utils

      - name: clang (linux)
        if: matrix.apt-clang
        run: sudo apt-get install -y clang

      # Intel's compilers, because the brief covers proprietary toolchains too
      # and not only the free ones. ElmerPost needs a Fortran compiler as well:
      # sico2elmer is Fortran.
      - name: intel oneapi
        if: matrix.intel
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-compiler-fortran
          echo "/opt/intel/oneapi/compiler/latest/bin" >> "$GITHUB_PATH"

      - name: dependencies (mingw)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.msys-packages }}

      # Homebrew's Tcl/Tk is Aqua, and ElmerPost needs the X11 build, so Tk is
      # compiled here against XQuartz. Cached, because it is the same result
      # every time and a few minutes is worth paying once rather than per run.
      - name: cache the X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        id: tcltk-cache
        uses: actions/cache@v4
        with:
          path: ~/tcltk-x11
          key: tcltk-x11-8.6.14-${{ matrix.os }}-v1

      - name: xquartz (macos)
        if: matrix.macos-x11
        run: |
          brew install --cask xquartz
          brew install gfortran || brew install gcc
          test -f /opt/X11/include/X11/Xlib.h || { echo "::error::XQuartz did not provide X11 headers"; exit 1; }
          ls /opt/X11/lib/libGL* || { echo "::error::XQuartz did not provide libGL"; exit 1; }
          # The GL headers as well as the library. macOS has its own OpenGL
          # framework, which offers <OpenGL/gl.h> and not <GL/gl.h>; GLAUX and
          # ElmerPost include the latter, so checking only for the library
          # would have passed while the build still could not find a header.
          test -f /opt/X11/include/GL/gl.h || { echo "::error::XQuartz did not provide GL/gl.h"; exit 1; }
          test -f /opt/X11/include/GL/glx.h || { echo "::error::XQuartz did not provide GL/glx.h"; exit 1; }
          echo "XQuartz provides X11, GL headers and libGL"

      - name: build an X11 Tcl/Tk (macos)
        if: matrix.macos-x11 && steps.tcltk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=8.6.14
          PREFIX="$HOME/tcltk-x11"
          mkdir -p "$RUNNER_TEMP/tcltk" && cd "$RUNNER_TEMP/tcltk"
          curl -fsSL -o tcl.tar.gz "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tcl$V-src.tar.gz"
          curl -fsSL -o tk.tar.gz  "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tk$V-src.tar.gz"
          tar xzf tcl.tar.gz && tar xzf tk.tar.gz
          ( cd "tcl$V/unix" && ./configure --prefix="$PREFIX" >/dev/null && make -j3 >/dev/null && make install >/dev/null )
          # --enable-aqua=no is what makes this the X11 Tk rather than the
          # native one Homebrew ships.
          ( cd "tk$V/unix" && ./configure --prefix="$PREFIX" --with-tcl="$PREFIX/lib" \
              --enable-aqua=no --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib >/dev/null \
            && make -j3 >/dev/null && make install >/dev/null )

      # A Tk that silently came out Aqua would defeat the whole job, so check
      # what was actually built rather than that the build succeeded.
      - name: the Tk built must be the X11 one (macos)
        if: matrix.macos-x11
        run: |
          set -e
          PREFIX="$HOME/tcltk-x11"
          test -f "$PREFIX/include/tk.h" || { echo "::error::no tk.h in $PREFIX"; exit 1; }
          lib=$(ls "$PREFIX"/lib/libtk8.6* | head -1)
          echo "tk library: $lib"
          if otool -L "$lib" | grep -qi 'libX11'; then
            echo "ok: Tk links libX11, so it is the X11 build"
          else
            echo "::error::Tk does not link libX11; it came out as the Aqua build"
            otool -L "$lib"
            exit 1
          fi
          echo "CMAKE_PREFIX_PATH=$PREFIX:/opt/X11" >> "$GITHUB_ENV"
          echo "TCL_ROOT=$PREFIX" >> "$GITHUB_ENV"

      - name: build
        if: '!matrix.mingw'
        shell: bash
        run: |
          if [ -f /opt/intel/oneapi/setvars.sh ]; then
            set +u; . /opt/intel/oneapi/setvars.sh; set -u
          fi
          echo "cmake: $(cmake --version | head -1)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-extra }}
          cmake --build build

      - name: build (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # sico2elmer is the only Fortran in the tree and is skipped where there is
      # no Fortran compiler, so which binaries are expected depends on the job.
      # Asserted both ways: a job with Fortran that produced no sico2elmer has
      # silently lost it, and one without Fortran that produced it means the
      # detection is not doing anything.
      - name: the expected binaries must exist
        shell: bash
        run: |
          set -e
          ep=$(find build -name 'ElmerPost' -type f -o -name 'ElmerPost.exe' -type f | head -1)
          s2e=$(find build -name 'sico2elmer' -type f -o -name 'sico2elmer.exe' -type f | head -1)
          echo "ElmerPost : ${ep:-MISSING}"
          echo "sico2elmer: ${s2e:-none}"
          [ -n "$ep" ] || { echo "::error::ElmerPost was not built"; exit 1; }
          if [ "${{ matrix.fortran }}" = "false" ]; then
            [ -z "$s2e" ] || { echo "::error::sico2elmer was built on a job with no Fortran compiler"; exit 1; }
          else
            [ -n "$s2e" ] || { echo "::error::sico2elmer was not built despite a Fortran compiler"; exit 1; }
          fi

      # MATC is a submodule rather than a copy. Assert that, because a stale
      # vendored copy is exactly the problem this replaces: the one that was
      # here missed twelve years of maintenance and failed to compile under any
      # compiler defaulting to C23.
      - name: matc must come from the submodule
        shell: bash
        run: |
          set -e
          test -f matc/.git || test -d matc/.git || { echo "::error::matc is not a submodule checkout"; exit 1; }
          grep -q 'AltElmer/matc' .gitmodules || { echo "::error::.gitmodules does not point at AltElmer/matc"; exit 1; }
          # Files that exist in only one of the two trees, so this tells the
          # maintained checkout from the old vendored copy without depending on
          # a string that may or may not be in the sources. An earlier version
          # of this step grepped for MATC_OPENMP in matc/src/*.c, which is not
          # there in either copy: it lives in src/CMakeLists.txt. That check
          # could only ever fail.
          test -f matc/LGPL-2.1 || { echo "::error::matc/LGPL-2.1 missing; not the maintained checkout"; exit 1; }
          test ! -f matc/matc.pro || { echo "::error::matc/matc.pro present; this is the old vendored copy"; exit 1; }
          echo "ok: matc is the AltElmer/matc submodule, not the vendored copy"

  # Does ElmerPost actually open its window?
  #
  # It builds and starts on Windows but its GLAUX window creation fails there
  # with ERROR_INVALID_HANDLE, in upstream's own build as much as in this one.
  # Linux is the platform whose GLX path was the one in use, so this job is
  # what decides whether that is a Windows-only problem or a general one.
  # Running under Xvfb with software GL, since the runners have no display and
  # no GPU.
  window:
    name: does it open a window (xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran libgl1-mesa-dev libglu1-mesa-dev tcl-dev tk-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev \
            xvfb x11-utils mesa-utils

      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: start it under Xvfb and look for its window
        run: |
          set -x
          export ELMER_POST_HOME="$PWD/build/share/elmerpost"
          exe=$(find build -name ElmerPost -type f | head -1)
          xvfb-run -a --server-args="-screen 0 1024x768x24" bash -c '
            '"$exe"' > out.log 2> err.log &
            pid=$!
            sleep 25
            echo "--- windows on the display ---"
            xwininfo -root -tree || true
            kill $pid 2>/dev/null || true
          ' || true
          echo "=== stdout ==="; cat out.log || true
          echo "=== stderr ==="; cat err.log || true

      # Reported rather than enforced. The point of this job is to find out
      # what happens on X11, and a job that fails the build would say less
      # than one that prints what it saw.
      - name: report
        run: |
          if grep -qi 'create window failed' err.log out.log 2>/dev/null; then
            echo "::warning::ElmerPost could not create its window under Xvfb either"
          else
            echo "no window creation failure reported"
          fi
