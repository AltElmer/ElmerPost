name: release

# Builds ElmerPost for each supported platform and attaches the archives to the
# release for the tag that triggered it.
#
# There is no single artifact that runs everywhere: this is native code linked
# against OpenGL and Tcl/Tk, so there is one archive per operating system and
# CPU architecture. Each carries the program, sico2elmer, and the data and Tcl
# scripts ElmerPost reads at run time, because without those it starts and can
# then do nothing.
#
# macOS builds through XQuartz, which supplies the X11 and GLX that ElmerPost's
# non-Windows path uses, together with a Tk built for X11 rather than Aqua. The
# archive carries that Tcl/Tk; XQuartz itself is a system component and has to
# be installed on the machine that runs it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x86_64
            os: windows-2022
            mingw: true
            msystem: UCRT64
            msys-prefix: ucrt64
            msys-packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-gcc-fortran
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-tcl
              mingw-w64-ucrt-x86_64-tk
          # Native arm64 Windows. MSYS2's arm64 environment has Tcl, Tk, CMake
          # and Ninja but no Fortran compiler, so this archive carries
          # ElmerPost without sico2elmer.
          - target: windows-arm64
            os: windows-11-arm
            mingw: true
            msystem: CLANGARM64
            msys-prefix: clangarm64
            msys-packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-tcl
              mingw-w64-clang-aarch64-tk
          # macOS, through XQuartz. The archive carries the X11 Tcl/Tk it was
          # built against; XQuartz itself is a system component and has to be
          # installed on the machine that runs it, which the README says.
          - target: macos-arm64
            os: macos-14
            macos-x11: true
          - target: macos-x86_64
            os: macos-15-intel
            macos-x11: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran libgl1-mesa-dev libglu1-mesa-dev tcl-dev tk-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev

      - name: dependencies (mingw)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.msys-packages }}

      # Same XQuartz and X11 Tcl/Tk recipe as ci.yml, where it is green on both
      # macOS architectures, including the check that the Tk links libX11
      # rather than quietly coming out as the Aqua build.
      - name: cache the X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        id: tcltk-cache
        uses: actions/cache@v4
        with:
          path: ~/tcltk-x11
          key: tcltk-x11-8.6.14-${{ matrix.os }}-v1

      - name: xquartz and an X11 Tcl/Tk (macos)
        if: matrix.macos-x11
        run: |
          set -e
          brew install --cask xquartz
          brew install gfortran || brew install gcc
          test -f /opt/X11/include/GL/gl.h || { echo "::error::XQuartz did not provide GL/gl.h"; exit 1; }
          PREFIX="$HOME/tcltk-x11"
          if [ ! -f "$PREFIX/include/tk.h" ]; then
            V=8.6.14
            mkdir -p "$RUNNER_TEMP/tcltk" && cd "$RUNNER_TEMP/tcltk"
            curl -fsSL -o tcl.tar.gz "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tcl$V-src.tar.gz"
            curl -fsSL -o tk.tar.gz  "https://downloads.sourceforge.net/project/tcl/Tcl/$V/tk$V-src.tar.gz"
            tar xzf tcl.tar.gz && tar xzf tk.tar.gz
            ( cd "tcl$V/unix" && ./configure --prefix="$PREFIX" >/dev/null && make -j3 >/dev/null && make install >/dev/null )
            ( cd "tk$V/unix" && ./configure --prefix="$PREFIX" --with-tcl="$PREFIX/lib" \
                --enable-aqua=no --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib >/dev/null \
              && make -j3 >/dev/null && make install >/dev/null )
          fi
          lib=$(ls "$PREFIX"/lib/libtk8.6* | head -1)
          otool -L "$lib" | grep -qi 'libX11' \
            || { echo "::error::Tk is not the X11 build"; otool -L "$lib"; exit 1; }
          tcllib=$(ls "$PREFIX"/lib/libtcl8.6* | head -1)
          {
            echo "MAC_TCLTK_ARGS=-DTCL_INCLUDE_PATH=$PREFIX/include -DTK_INCLUDE_PATH=$PREFIX/include -DTCL_LIBRARY=$tcllib -DTK_LIBRARY=$lib -DTCL_TCLSH=$PREFIX/bin/tclsh8.6 -DOPENGL_INCLUDE_DIR=/opt/X11/include -DOPENGL_gl_LIBRARY=/opt/X11/lib/libGL.dylib -DOPENGL_glu_LIBRARY=/opt/X11/lib/libGLU.dylib"
            echo "MAC_TCLTK_PREFIX=$PREFIX"
          } >> "$GITHUB_ENV"

      - name: build
        if: '!matrix.mingw'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/elmerpost-${{ matrix.target }}" ${MAC_TCLTK_ARGS:-}
          if [ -n "${MAC_TCLTK_PREFIX:-}" ]; then
            used=$(grep -E '^(TCL|TK)_(LIBRARY|INCLUDE_PATH):' build/CMakeCache.txt || true)
            echo "$used"
            echo "$used" | grep -qi 'framework' \
              && { echo "::error::configure picked Apple's Tcl/Tk framework"; exit 1; }
          fi
          cmake --build build
          cmake --install build

      # The Tcl/Tk built for this job lives in the runner's home directory, so
      # an archive that merely links against it would work nowhere else.
      - name: bundle the macos libraries
        if: matrix.macos-x11
        shell: bash
        run: |
          set -e
          d="dist/elmerpost-${{ matrix.target }}"
          libdir="$d/lib/bundled"
          mkdir -p "$libdir"
          cp -f "$MAC_TCLTK_PREFIX"/lib/libtcl8.6* "$MAC_TCLTK_PREFIX"/lib/libtk8.6* "$libdir/" 2>/dev/null || true
          chmod u+w "$libdir"/* 2>/dev/null || true
          # Tcl and Tk load their own script libraries at run time.
          cp -r "$MAC_TCLTK_PREFIX"/lib/tcl8.6 "$MAC_TCLTK_PREFIX"/lib/tk8.6 "$d/lib/" 2>/dev/null || true
          for bin in $(find "$d" -type f -perm -u+x); do
            file "$bin" | grep -qi 'Mach-O.*executable' || continue
            otool -L "$bin" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in "$MAC_TCLTK_PREFIX"/*) ;; *) continue ;; esac
              install_name_tool -change "$dep" "@executable_path/../lib/bundled/$(basename "$dep")" "$bin" 2>/dev/null || true
            done
          done
          echo "bundled: $(ls "$libdir" | wc -l) libraries"
          # A binary still pointing at the runner's home directory would work
          # only on this machine, so that is a failure rather than a warning.
          for bin in $(find "$d" -type f -perm -u+x); do
            file "$bin" | grep -qi 'Mach-O.*executable' || continue
            if otool -L "$bin" | grep -q "$MAC_TCLTK_PREFIX"; then
              echo "::error::$bin still references $MAC_TCLTK_PREFIX"
              otool -L "$bin"; exit 1
            fi
          done
          echo "ok: nothing points at the build machine's home directory"

      - name: build (mingw)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist/elmerpost-${{ matrix.target }}
          cmake --build build
          cmake --install build

      # The archive has to run on a machine that has never seen MSYS2. CMake
      # already installs the Tcl and Tk trees on this platform; what is left is
      # the compiler runtime and anything else the binaries pull from
      # /ucrt64/bin. Resolved with ldd rather than listed by hand, so a
      # dependency added later is picked up instead of missed.
      - name: bundle the windows runtime
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -e
          d="dist/elmerpost-${{ matrix.target }}/bin"
          mkdir -p "$d"
          echo "bundling into $d"
          ls -l "$d" || true

          # objdump, not ldd. ldd lives in MSYS2's msys environment and this
          # job installs only the packages it asks for, so ldd is absent: the
          # step dies on its first command under set -e, before reaching any
          # echo, and reports exit 1 with no output at all. That is exactly
          # what happened to elmerfront's release. objdump comes with binutils
          # alongside the compiler.
          #
          # Repeated until nothing new is copied, because the DLLs have
          # dependencies of their own.
          pass=0
          while : ; do
            pass=$((pass+1))
            before=$(find "$d" -maxdepth 1 -name '*.dll' | wc -l)
            for bin in "$d"/*.exe "$d"/*.dll; do
              [ -f "$bin" ] || continue
              objdump -p "$bin" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
                [ -f "/${{ matrix.msys-prefix }}/bin/$dll" ] || continue
                cp -n "/${{ matrix.msys-prefix }}/bin/$dll" "$d/" 2>/dev/null || true
              done
            done
            after=$(find "$d" -maxdepth 1 -name '*.dll' | wc -l)
            echo "pass $pass: $before -> $after DLLs"
            [ "$after" -gt "$before" ] || break
            [ "$pass" -lt 8 ] || break
          done

      - name: package
        shell: bash
        run: |
          set -e
          d="dist/elmerpost-${{ matrix.target }}"
          cp README.md "$d/" 2>/dev/null || true
          cp tcl_license.terms tk_license.terms "$d/" 2>/dev/null || true

          # An archive without the program, or without the scripts it loads at
          # startup, is worse than a failed build because it looks like a
          # release. Checked before anything is uploaded.
          exe=$(find "$d" -name 'ElmerPost' -type f -o -name 'ElmerPost.exe' -type f | head -1)
          [ -n "$exe" ] || { echo "::error::no ElmerPost binary in the archive"; exit 1; }
          find "$d" -name 'init.tcl' | grep -q . \
            || { echo "::error::no tcl scripts in the archive; ElmerPost would start and do nothing"; exit 1; }
          echo "binary: $exe"
          { ls -lR "$d" || true; } | head -40 || true

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "elmerpost-${{ matrix.target }}.zip" "elmerpost-${{ matrix.target }}"
          else
            tar czf "elmerpost-${{ matrix.target }}.tar.gz" "elmerpost-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elmerpost-${{ matrix.target }}
          path: dist/elmerpost-*.*
          if-no-files-found: error

  publish:
    needs: build
    # always(), so a platform that fails does not withhold the platforms that
    # worked. A release with four of six archives is useful; a release with
    # none because one target broke is not. The publish step below fails if
    # nothing at all was produced.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list what will be published
        run: ls -lR dist

      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**/elmerpost-*.*
